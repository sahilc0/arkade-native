[workspace]
members = ["rust", "crates/arkade-boltz", "cli", "uniffi-bindgen"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Ark SDK
ark-client = { git = "https://github.com/arkade-os/rust-sdk", features = ["sqlite"] }
ark-core = { git = "https://github.com/arkade-os/rust-sdk" }
ark-bdk-wallet = { git = "https://github.com/arkade-os/rust-sdk" }

# Internal crates
arkade-core = { path = "rust" }
arkade-boltz = { path = "crates/arkade-boltz" }

# Bitcoin
bitcoin = { version = "0.32.7", features = ["rand", "serde"] }
bip39 = { version = "2", features = ["rand"] }
lightning-invoice = { version = "0.33.2", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["global-context"] }
esplora-client = { version = "0.11", features = ["async-https"] }

# FFI
uniffi = "0.28"

# Async
tokio = { version = "1.41", features = ["full"] }
flume = "0.11"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS — force ring backend (aws-lc-rs doesn't work on iOS simulator)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Misc
thiserror = "1.0"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
bech32 = "0.11"
anyhow = "1"

[patch.'https://github.com/arkade-os/rust-sdk']
ark-grpc = { path = "patches/ark-grpc" }
